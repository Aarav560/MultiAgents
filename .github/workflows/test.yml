name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python3 -m unittest discover -v tests
      - name: Validate plugin.json
        run: python3 -m json.tool .claude-plugin/plugin.json > /dev/null
      - name: Validate marketplace.json
        run: python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
      - name: Validate hooks.json
        run: python3 -m json.tool hooks/hooks.json > /dev/null
      - name: Validate example
        run: |
          cd "$(mktemp -d)"
          python3 "$GITHUB_WORKSPACE/skills/hive/scripts/hive.py" init
          cp "$GITHUB_WORKSPACE"/examples/saas-api/{context.md,plan.md} .hive/
          python3 .hive/bin/hive.py validate

  spacesim:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: demos/spacesim
    steps:
      - uses: actions/checkout@v4
      - name: Build and unit-test orbit
        run: make all test
      - name: Scenario sweep
        run: sh tests/run_scenarios.sh

  spacesim-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: demos/spacesim
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - name: Build and unit-test orbit with build.bat
        run: build.bat test
      - name: Run scenarios
        run: |
          build\orbit.exe --scenario figure8 --integrator yoshida --quiet || exit /b 1
          build\orbit.exe --scenario hohmann --quiet || exit /b 1
          build\orbit.exe --scenario solar --ascii --fps 0 --steps 200 --quiet > NUL || exit /b 1
          build\orbit.exe --scenario cluster --gravity bh --steps 50 --ppm out\cluster --quiet || exit /b 1
          if not exist out\cluster\frame_000000.ppm exit /b 1
