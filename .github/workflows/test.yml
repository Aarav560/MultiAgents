name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python3 -m unittest discover -v tests
      - name: Validate plugin.json
        run: python3 -m json.tool .claude-plugin/plugin.json > /dev/null
      - name: Validate marketplace.json
        run: python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
      - name: Validate hooks.json
        run: python3 -m json.tool hooks/hooks.json > /dev/null
      - name: Validate example
        run: |
          cd "$(mktemp -d)"
          python3 "$GITHUB_WORKSPACE/skills/hive/scripts/hive.py" init
          cp "$GITHUB_WORKSPACE"/examples/saas-api/{context.md,plan.md} .hive/
          python3 .hive/bin/hive.py validate

  spacesim:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: demos/spacesim
    steps:
      - uses: actions/checkout@v4
      - name: Build and unit-test orbit
        run: make all test
      - name: Scenario sweep
        run: sh tests/run_scenarios.sh

  spacesim-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: demos/spacesim
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - name: Build and unit-test orbit with build.bat
        run: build.bat test
      - name: Run scenarios
        run: |
          build\orbit.exe --scenario figure8 --integrator yoshida --quiet || exit /b 1
          build\orbit.exe --scenario hohmann --quiet || exit /b 1
          build\orbit.exe --scenario solar --ascii --fps 0 --steps 200 --quiet > NUL || exit /b 1
          build\orbit.exe --scenario cluster --gravity bh --steps 50 --ppm out\cluster --quiet || exit /b 1
          if not exist out\cluster\frame_000000.ppm exit /b 1

  starsim:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: examples/starsim
    steps:
      - uses: actions/checkout@v4
      - name: Install X11 and a virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libx11-dev xvfb
      - name: Build (windowed) and run unit tests
        run: make all test
      - name: Headless screenshots of every scenario
        run: |
          make headless
          for i in 1 2 3 4 5 6 7; do ./build/starsim-headless --scenario $i --shot build/shot$i.ppm --frames 60; test -s build/shot$i.ppm; done
      - name: Run the real window for a few seconds (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          set +e
          timeout 5 xvfb-run -a ./build/starsim --scenario 4
          code=$?
          echo "exit code $code"
          test $code -eq 124 -o $code -eq 0

  starsim-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: examples/starsim
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - name: Build and unit-test with build.bat
        run: build.bat test
      - name: Headless screenshot through the Windows build
        run: build\starsim.exe --scenario 4 --shot shot.ppm --frames 60 && if not exist shot.ppm exit /b 1
