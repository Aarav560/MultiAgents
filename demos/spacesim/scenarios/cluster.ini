# Plummer sphere cluster: 400 equal-mass bodies self-organizing under gravity.
# Watch for: initial collapse, virialization (settling to equilibrium), energy conservation,
# and the emergence of hierarchical structure. Uses Barnes-Hut gravity for efficiency.

[cluster]
scenario = cluster
integrator = leapfrog
gravity = bh
theta = 0.6
every = 5
seed = 42

# Optional: uncomment to enable output formats
# csv = out/cluster.csv
# ppm = out/cluster
# ascii = 1

# Suggested scenario parameters (commented; uncomment to override):
# dt = 0.01
# duration = 10
# softening = 0.05
