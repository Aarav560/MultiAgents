# Earth-Moon System
# Demonstrates the two-body orbital dynamics of Earth and the Moon.
# Earth is 384,400 km from the Moon. Watch for: stable circular orbit,
# center-of-mass wobble, and periodic distance oscillations.
# (Duration: 28 days, dt: 60 s as suggested by the scenario.)

scenario = earth-moon
integrator = leapfrog
gravity = direct
every = 200

# Uncomment to save ASCII art every frame:
# ascii = 1

# Uncomment to render PPM frames (motion trails enabled by default):
# ppm = out/earth-moon
# width = 800
# height = 800
