# Disk Galaxy: a central star with 1500 test particles on circular orbits
# This scenario demonstrates Barnes-Hut gravity and long-term disk stability.
# Watch for: circular orbits maintained by the central mass, disk structure preservation,
# Barnes-Hut efficiency with many particles over long integrations.

# Scenario and integration
scenario = disk
integrator = leapfrog
gravity = bh
theta = 0.6

# Output every 20 steps gives ~200 frames over 20 seconds.
every = 20

# Uncomment to write PPM frames:
# ppm = out/disk
