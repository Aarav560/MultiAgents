# Binary star system with circumbinary planet
# ============================================
# This scenario shows a binary star system (two equal-mass solar-mass stars) in a
# highly eccentric orbit (e=0.5, a=1 AU), plus a circumbinary planet at 4 AU.
# Watch for:
# - The stars' coupled elliptical orbit and varying separation
# - Gravitational perturbations on the planet's orbit
# - Orbital resonances and potential chaotic dynamics
# - Conservation of energy and angular momentum over 3 years

scenario = binary
integrator = leapfrog
gravity = direct
every = 130

# Optional: enable ASCII output to see the system evolve in the terminal
# ascii = 1

# Optional: write PPM frames (requires 'out/' directory to exist)
# ppm = out/binary
