# Hohmann transfer: Earth to geostationary orbit
# A spacecraft in a circular 7000 km orbit around Earth performs a classic two-impulse Hohmann transfer
# to reach geostationary orbit at 42164 km. Watch for the two distinct burn impulses and the smooth
# coasting arc between them (elliptical transfer orbit). Demonstrates orbital mechanics and maneuver planning.

scenario = hohmann
integrator = leapfrog
gravity = direct

# Output approximately 200 frames
every = 11

# Uncomment to render frames as PPM images:
# ppm = out/hohmann

# ASCII display of the system state at each output step
ascii = 1

# dt and duration are set by the scenario itself
