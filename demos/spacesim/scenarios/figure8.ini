# Figure-8 Orbit: Three-body choreography with Chenciner-Montgomery initial conditions
# This scenario demonstrates a periodic solution to the chaotic three-body problem where
# all three equal masses trace a smooth figure-eight pattern indefinitely.
# Watch for: the elegant symmetry of the figure-8 path, conservation of energy and momentum,
# the periodic return to initial conditions after one cycle.

# Scenario and integration
scenario = figure8
integrator = yoshida
gravity = direct

# Output every ~32 steps gives ~200 frames over the 6.3259 s cycle.
every = 32

# Uncomment to write PPM frames:
# ppm = out/figure8
